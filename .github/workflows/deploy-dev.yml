name: Deploy Dev

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Validate, deploy, and smoke test Dev
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: dev
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_WAREHOUSE_ID: ${{ vars.DATABRICKS_WAREHOUSE_ID }}

    steps:
      - name: Check out the verified revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Check deployment configuration
        run: |
          test -n "${DATABRICKS_HOST}"
          test -n "${DATABRICKS_TOKEN}"
          test -n "${DATABRICKS_WAREHOUSE_ID}"
          databricks current-user me

      - name: Validate Dev bundle
        run: >-
          databricks bundle validate -t dev
          --var="warehouse_id=${DATABRICKS_WAREHOUSE_ID}"
      
      - name: Preview Dev deployment
        run: >-
          databricks bundle plan -t dev
          --var="warehouse_id=${DATABRICKS_WAREHOUSE_ID}"

      - name: Deploy Dev bundle
        run: >-
          databricks bundle deploy -t dev
          --var="warehouse_id=${DATABRICKS_WAREHOUSE_ID}"

      - name: Verify Dev deployment (dry-run)
        run: >-
          databricks bundle summary -t dev
          --var="warehouse_id=${DATABRICKS_WAREHOUSE_ID}"
