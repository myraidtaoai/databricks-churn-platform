resources:
  schemas:
    churn_schema:
      name: ${var.schema}
      catalog_name: ${var.catalog}
      comment: Managed schema for the Telco churn bundle.

  volumes:
    landing:
      name: landing
      catalog_name: ${resources.schemas.churn_schema.catalog_name}
      schema_name: ${resources.schemas.churn_schema.name}
      volume_type: MANAGED
      comment: Landing files for the Telco churn pipeline.

  experiments:
    churn_training:
      # MLflow requires the parent directory to exist before this resource is
      # created. The user's workspace home always exists; nested bundle
      # subdirectories may not exist yet during the resource deployment phase.
      name: /Users/${workspace.current_user.userName}/${bundle.name}-${bundle.target}-churn-training

  registered_models:
    telco_churn_model:
      name: telco_churn_model
      catalog_name: ${resources.schemas.churn_schema.catalog_name}
      schema_name: ${resources.schemas.churn_schema.name}
      comment: Champion model selected by validation PR-AUC.

  dashboards:
    churn_exploration_and_model_results:
      display_name: Telco Churn — Exploration & Model Results
      file_path: ../dashboards/churn_exploration_and_model_results.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${resources.schemas.churn_schema.catalog_name}
      dataset_schema: ${resources.schemas.churn_schema.name}
    pipeline_observability:
      display_name: Pipeline Observability
      file_path: ../dashboards/pipeline_observability.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${resources.schemas.churn_schema.catalog_name}
      dataset_schema: ${resources.schemas.churn_schema.name}

  jobs:
    churn_event_generator:
      name: ${bundle.target}-churn-event-generator
      description: Generate a deterministic daily customer-event batch in the landing Volume.
      max_concurrent_runs: 1
      timeout_seconds: 1800
      schedule:
        quartz_cron_expression: "0 0 5 * * ?"
        timezone_id: America/Toronto
        pause_status: UNPAUSED
      parameters:
        - name: event_date
          default: ""
        - name: seed
          default: "20260801"
        - name: drift_level
          default: "0.0"
      environments:
        - environment_key: etl_v4
          spec:
            environment_version: "4"
      tasks:
        - task_key: generate_customer_events
          environment_key: etl_v4
          spark_python_task:
            python_file: "../src/churn_pipeline/ingestion/generate_events.py"
            parameters:
              - --catalog
              - ${resources.schemas.churn_schema.catalog_name}
              - --schema
              - ${resources.schemas.churn_schema.name}
              - --output-root
              - /Volumes/${resources.volumes.landing.catalog_name}/${resources.volumes.landing.schema_name}/${resources.volumes.landing.name}/events
              - --event-date
              - "{{job.parameters.event_date}}"
              - --seed
              - "{{job.parameters.seed}}"
              - --drift-level
              - "{{job.parameters.drift_level}}"

    churn_seed_bronze:
      name: ${bundle.target}-churn-seed-bronze
      description: One-time historical seed — load the bundled Telco CSV into Bronze.
      max_concurrent_runs: 1
      timeout_seconds: 3600
      environments:
        - environment_key: etl_v4
          spec:
            environment_version: "4"
      tasks:
        - task_key: ingest_bronze
          environment_key: etl_v4
          spark_python_task:
            python_file: "../src/churn_pipeline/ingestion/ingest.py"
            parameters:
              - --catalog
              - ${resources.schemas.churn_schema.catalog_name}
              - --schema
              - ${resources.schemas.churn_schema.name}
              - --landing-file
              - /Volumes/${resources.volumes.landing.catalog_name}/${resources.volumes.landing.schema_name}/${resources.volumes.landing.name}/${var.source_file_name}
              - --bundled-source-file
              - ${workspace.file_path}/data/${var.source_file_name}

    churn_data_pipeline:
      name: ${bundle.target}-churn-data-pipeline
      description: Ingest Bronze data and produce validated Silver and Gold tables.
      max_concurrent_runs: 1
      timeout_seconds: 7200
      # Keep ETL on the untouched Databricks base environment. Install only
      # missing model libraries in a separate environment so compiled ML
      # wheels cannot break Spark Connect initialization in Bronze/Silver.
      environments:
        - environment_key: etl_v4
          spec:
            environment_version: "4"
      tasks:
        - task_key: ingest_events
          environment_key: etl_v4
          spark_python_task:
            python_file: "../src/churn_pipeline/ingestion/ingest_events.py"
            parameters:
              - --catalog
              - ${resources.schemas.churn_schema.catalog_name}
              - --schema
              - ${resources.schemas.churn_schema.name}
              - --events-path
              - /Volumes/${resources.volumes.landing.catalog_name}/${resources.volumes.landing.schema_name}/${resources.volumes.landing.name}/events
              - --checkpoint-path
              - /Volumes/${resources.volumes.landing.catalog_name}/${resources.volumes.landing.schema_name}/${resources.volumes.landing.name}/_checkpoints/event_ingest
        - task_key: transform_silver_and_gold
          depends_on: [{task_key: ingest_events}]
          environment_key: etl_v4
          spark_python_task:
            python_file: "../src/churn_pipeline/transformation/transform.py"
            parameters:
              - --catalog
              - ${resources.schemas.churn_schema.catalog_name}
              - --schema
              - ${resources.schemas.churn_schema.name}
        - task_key: transform_events
          depends_on: [{task_key: ingest_events}]
          environment_key: etl_v4
          spark_python_task:
            python_file: "../src/churn_pipeline/transformation/transform_events.py"
            parameters:
              - --catalog
              - ${resources.schemas.churn_schema.catalog_name}
              - --schema
              - ${resources.schemas.churn_schema.name}
        - task_key: build_features
          depends_on: [{task_key: transform_silver_and_gold}, {task_key: transform_events}]
          environment_key: etl_v4
          spark_python_task:
            python_file: "../src/churn_pipeline/transformation/build_features.py"
            parameters:
              - --catalog
              - ${resources.schemas.churn_schema.catalog_name}
              - --schema
              - ${resources.schemas.churn_schema.name}
        - task_key: generate_labels
          depends_on: [{task_key: build_features}]
          environment_key: etl_v4
          spark_python_task:
            python_file: "../src/churn_pipeline/transformation/generate_labels.py"
            parameters:
              - --catalog
              - ${resources.schemas.churn_schema.catalog_name}
              - --schema
              - ${resources.schemas.churn_schema.name}

    churn_backfill_features:
      name: ${bundle.target}-churn-backfill-features
      description: Build features and labels for a single historical as_of_date.
      max_concurrent_runs: 3
      timeout_seconds: 3600
      parameters:
        - name: as_of_date
          default: ""

      environments:
        - environment_key: etl_v4
          spec:
            environment_version: "4"

      tasks:
        - task_key: build_features
          environment_key: etl_v4
          spark_python_task:
            python_file: "../src/churn_pipeline/transformation/build_features.py"
            parameters:
              - --catalog
              - ${resources.schemas.churn_schema.catalog_name}
              - --schema
              - ${resources.schemas.churn_schema.name}
              - --as-of-date
              - "{{job.parameters.as_of_date}}"
        - task_key: generate_labels
          depends_on: [{task_key: build_features}]
          environment_key: etl_v4
          spark_python_task:
            python_file: "../src/churn_pipeline/transformation/generate_labels.py"
            parameters:
              - --catalog
              - ${resources.schemas.churn_schema.catalog_name}
              - --schema
              - ${resources.schemas.churn_schema.name}
              - --as-of-date
              - "{{job.parameters.as_of_date}}"

    churn_model_pipeline:
      name: ${bundle.target}-churn-model-pipeline
      description: Train a Candidate model and apply the Champion promotion policy.
      max_concurrent_runs: 1
      timeout_seconds: 7200
      schedule:
        quartz_cron_expression: "0 0 7 1,15 * ?"
        timezone_id: America/Toronto
        pause_status: UNPAUSED

      environments:
        - environment_key: ml_v4
          spec:
            environment_version: "4"
            dependencies:
              - mlflow==2.22.0
              - imbalanced-learn==0.13.0
              - xgboost==2.1.4
              - lightgbm==4.6.0
              - shap==0.47.2

      tasks:
        - task_key: train_and_register_model
          environment_key: ml_v4
          spark_python_task:
            python_file: "../src/churn_pipeline/modeling/train.py"
            parameters:
              - --catalog
              - ${resources.schemas.churn_schema.catalog_name}
              - --schema
              - ${resources.schemas.churn_schema.name}
              - --experiment-name
              - ${resources.experiments.churn_training.name}
              - --model-name
              - ${resources.registered_models.telco_churn_model.full_name}

        - task_key: evaluate_and_promote_candidate
          depends_on:
            - task_key: train_and_register_model
          environment_key: ml_v4
          spark_python_task:
            python_file: "../src/churn_pipeline/modeling/promote.py"
            parameters:
              - --catalog
              - ${resources.schemas.churn_schema.catalog_name}
              - --schema
              - ${resources.schemas.churn_schema.name}
              - --model-name
              - ${resources.registered_models.telco_churn_model.full_name}
    churn_batch_score:
      name: ${bundle.target}-churn-batch-score
      description: Score the current customer snapshot with the approved Champion.
      max_concurrent_runs: 1
      timeout_seconds: 3600

      environments:
        - environment_key: ml_v4
          spec:
            environment_version: "4"
            dependencies:
              - mlflow==2.22.0
              - imbalanced-learn==0.13.0
              - xgboost==2.1.4
              - lightgbm==4.6.0
              - shap==0.47.2

      tasks:
        - task_key: batch_score_customers
          environment_key: ml_v4
          spark_python_task:
            python_file: "../src/churn_pipeline/modeling/score.py"
            parameters:
              - --catalog
              - ${resources.schemas.churn_schema.catalog_name}
              - --schema
              - ${resources.schemas.churn_schema.name}
              - --model-name
              - ${resources.registered_models.telco_churn_model.full_name}
              - --scoring-run-id
              - "{{job.run_id}}"

    churn_drift_monitor:
      name: ${bundle.target}-churn-drift-monitor
      description: Compute feature and prediction drift metrics vs training baseline.
      max_concurrent_runs: 1
      timeout_seconds: 1800

      environments:
        - environment_key: etl_v4
          spec:
            environment_version: "4"
            dependencies:
              - numpy

      tasks:
        - task_key: compute_drift
          environment_key: etl_v4
          spark_python_task:
            python_file: "../src/churn_pipeline/monitoring/monitor.py"
            parameters:
              - --catalog
              - ${resources.schemas.churn_schema.catalog_name}
              - --schema
              - ${resources.schemas.churn_schema.name}

    churn_model_rollback:
      name: ${bundle.target}-churn-model-rollback
      description: Manually restore the Champion alias to a validated model version.
      max_concurrent_runs: 1
      timeout_seconds: 1800
      parameters:
        - name: target_version
          default: ""
      environments:
        - environment_key: ml_v4
          spec:
            environment_version: "4"
            dependencies:
              - mlflow==2.22.0
      tasks:
        - task_key: rollback_champion
          environment_key: ml_v4
          spark_python_task:
            python_file: "../src/churn_pipeline/modeling/rollback.py"
            parameters:
              - --catalog
              - ${resources.schemas.churn_schema.catalog_name}
              - --schema
              - ${resources.schemas.churn_schema.name}
              - --model-name
              - ${resources.registered_models.telco_churn_model.full_name}
              - --target-version
              - "{{job.parameters.target_version}}"

    churn_end_to_end:
      name: ${bundle.target}-churn-end-to-end
      description: Orchestrate data preparation and batch scoring.
      max_concurrent_runs: 1
      timeout_seconds: 18000
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Toronto
        pause_status: UNPAUSED
      tasks:
        - task_key: run_data_pipeline
          run_job_task:
            job_id: ${resources.jobs.churn_data_pipeline.id}

        - task_key: run_batch_score
          depends_on:
            - task_key: run_data_pipeline
          run_job_task:
            job_id: ${resources.jobs.churn_batch_score.id}
